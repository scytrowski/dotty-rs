name: Typer focused audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/typer-focused-audit.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/dotty-core/**'
      - 'crates/dotty-classfile/**'
      - 'crates/dotty-classloader/**'
      - 'crates/dotty-namer/**'
      - 'crates/dotty-lexer/**'
      - 'crates/dotty-parser/**'
      - 'crates/dotty-tasty/**'
      - 'crates/dotty-tasty-unpickler/**'
      - 'crates/dotty-typer/**'
      - 'tools/typer-classpath-corpus-audit/**'
      - 'tools/write-typer-focused-audit-report.py'
      - 'docs/typer-*.md'
      - 'docs/typer-*.tsv'
      - 'docs/typer-lexical-closure-acceptance-recovery-3.9.0/**'
      - 'docs/typer-focused-smoke-baseline-3.9.0.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typer-focused-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  focused-audit:
    name: Focused semantic regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: 1
      SCALA39_JDK_RELEASE: 21
      SCALA39_ROOT: ${{ github.workspace }}/scala39-source
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TMPDIR: ${{ github.workspace }}/target/tmp
      DOTTY_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DOTTY_EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    steps:
      - name: Prepare worktree-local scratch
        run: mkdir -p "$TMPDIR"

      - name: Check out dotty-rs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Enforce integrated recursive Expr prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for prerequisite in \
            7165bfc6f02c66706a86b5ea814ca49a757187b7 \
            eb4ff37f704e8d1a112a46a294403d92a5a07767 \
            73748e6dec188fb60c030d61d7b33a2b0706b2e7 \
            e50e2cf465d833049b4c202919548198bc41fd8c \
            0fc457776374f69d6b16187c007721a85b2557a0 \
            918b4e3d757585799fbbe88d0f56b7fc44bbb43c \
            d62365e3cf2e6b322cceabdbd9e697670eb9e1b5 \
            deedd4c8581b31392c38f48060774466f50110c0 \
            31ed0e3232069410e76dfa9ccfe2291bebeb97f9 \
            5b8a7f0603f89d458fbfb1213d7dd2b94f5204da \
            e5afcb6fb70c6aeea574d0543df937a6e95c80ef \
            60cc3ce645b216b14fe90a31ee5ce975b9e2c2e6 \
            3c1755c84042411681ec7bf05045fe00ce1c9d41 \
            b3f0d16ee03826fb76333e885e10281762f09cd3 \
            0a42c58ca5fbb10b2fa7059ad0a327d9d3a4e711 \
            bdf64e102ac7d5dc247205a7365b5728f883d1d6 \
            fde2273680bc367594debba49725b58a0bc8bd98 \
            5b9e24ab3f16bc8f500d99f99b3277079d4b00ff \
            b598e1c38a420a657a41e20ffe87e1a7832cb345; do
            git merge-base --is-ancestor "$prerequisite" HEAD || {
              echo "required recursive Expr prerequisite $prerequisite is not integrated in HEAD=$(git rev-parse HEAD)" >&2
              exit 1
            }
          done
          printf 'Verified #2132-#2137 and prior recursive Expr prerequisite merge ancestry at HEAD %s\n' "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$DOTTY_EXPECTED_BASE_SHA" HEAD || {
            echo "integrated baseline $DOTTY_EXPECTED_BASE_SHA is not an ancestor of tested HEAD=$(git rev-parse HEAD)" >&2
            exit 1
          }

      - name: Run audit tooling unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/typer-classpath-corpus-audit -p 'test_*.py'

      - name: Validate frozen lexical closure acceptance inputs
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$CARGO_TARGET_DIR/typer-focused-report"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_lexical_closure_acceptance.py inputs
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_inherited_members_acceptance.py inputs
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py inputs
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py recursive-inputs
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py binary-inputs

      - name: Check out pinned Scala 3.9.0 sources
        uses: actions/checkout@v4
        with:
          repository: scala/scala3
          ref: 777528f19a58e794c9954a42f433373472ec57f8
          path: scala39-source
          persist-credentials: false

      - name: Install pinned JDK 21.0.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
          check-latest: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Cache Cargo dependencies and test artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: ${{ runner.os }}-typer-focused-1.98.1-${{ hashFiles('**/Cargo.lock') }}-test-no-debug-no-incremental
          restore-keys: |
            ${{ runner.os }}-typer-focused-1.98.1-

      - name: Verify pinned inputs and record environment
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ github.workspace }}/target/coursier/v1/https/repo1.maven.org/maven2
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
          DOTTY_INHERITED_MEMBERS_TMP_ROOT: ${{ github.workspace }}/target/inherited-members-oracle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DOTTY_EXPECTED_SOURCE_SHA"
          test "$(git -C "$SCALA39_ROOT" rev-parse HEAD)" = "777528f19a58e794c9954a42f433373472ec57f8"
          grep -q '^JAVA_VERSION="21.0.8"$' "$JAVA_HOME/release"
          test -d "$JAVA_HOME/jmods"
          mkdir -p "$COURSIER_MAVEN_ROOT" "$DOTTY_AUDIT_REPORT_DIR"
          {
            printf 'dotty-rs_commit\t%s\n' "$(git rev-parse HEAD)"
            printf 'scala3_commit\t%s\n' "$(git -C "$SCALA39_ROOT" rev-parse HEAD)"
            printf 'pull_request_head_sha\t%s\n' "${{ github.event.pull_request.head.sha || github.sha }}"
            printf 'tested_source_sha\t%s\n' "$(git rev-parse HEAD)"
            printf 'pull_request_base_sha\t%s\n' "${{ github.event.pull_request.base.sha || github.sha }}"
            printf 'issue2080_baseline_sha\t%s\n' "$DOTTY_EXPECTED_BASE_SHA"
            printf 'issue2080_tested_sha\t%s\n' "$(git rev-parse HEAD)"
            printf 'issue2080_pr_head_sha\t%s\n' "${{ github.event.pull_request.head.sha || github.sha }}"
            printf 'issue2138_baseline_sha\t%s\n' "$DOTTY_EXPECTED_BASE_SHA"
            printf 'issue2138_tested_sha\t%s\n' "$(git rev-parse HEAD)"
            printf 'issue2138_pr_head_sha\t%s\n' "${{ github.event.pull_request.head.sha || github.sha }}"
            printf 'github_actions_run\t%s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'main_manifest_sha256\t%s\n' \
              "$(sha256sum docs/typer-stdlib-minimal-method-cohort-3.9.0.tsv | cut -d' ' -f1)"
            printf 'analysis_manifest_sha256\t%s\n' \
              "$(sha256sum docs/typer-stdlib-holdout-acceptance-ii-3.9.0.tsv | cut -d' ' -f1)"
            printf 'six_root_contract_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/lexical-closure-contract/six-root-gate.tsv | cut -d' ' -f1)"
            printf 'negative_matrix_sha256\t%s\n' \
              "$(sha256sum docs/typer-lexical-closure-rollback-matrix-3.9.0.tsv | cut -d' ' -f1)"
            printf 'case_match_positive_source_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-case-class-match-3.9.0/Positive.scala | cut -d' ' -f1)"
            printf 'case_match_source_manifest_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-case-class-match-3.9.0/source-hashes.tsv | cut -d' ' -f1)"
            printf 'case_match_scala_matrix_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-case-class-match-3.9.0/scala-matrix.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_source_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-sealed-adt-match-3.9.0/Event.scala | cut -d' ' -f1)"
            printf 'sealed_adt_source_manifest_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-sealed-adt-match-3.9.0/source-hashes.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_scala_matrix_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-sealed-adt-match-3.9.0/scala-matrix.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_rust_failure_matrix_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-sealed-adt-match-3.9.0/rust-failure-matrix.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_scala_failure_matrix_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-sealed-adt-match-3.9.0/scala-failure-matrix.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_structural_lifecycle_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-sealed-adt-match-3.9.0/rust-structural-lifecycle.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_positive_receipt_sha256\t%s\n' \
              "$(sha256sum docs/typer-sealed-adt-e2e-positive-3.9.0.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_negative_receipt_sha256\t%s\n' \
              "$(sha256sum docs/typer-sealed-adt-e2e-negative-rollback-3.9.0.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_cohort_contract_sha256\t%s\n' \
              "$(sha256sum docs/typer-source-case-class-match-cohorts-3.9.0.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_cohort_receipt_sha256\t%s\n' \
              "$(sha256sum docs/typer-sealed-adt-e2e-cohort-receipt-3.9.0.tsv | cut -d' ' -f1)"
            printf 'sealed_adt_cohort_summary_sha256\t%s\n' \
              "$(sha256sum docs/typer-sealed-adt-e2e-cohorts-3.9.0.tsv | cut -d' ' -f1)"
            printf 'product2_positive_source_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-case-class-product2-3.9.0/Positive.scala | cut -d' ' -f1)"
            printf 'binary_recursive_adt_source_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-binary-recursive-adt-3.9.0/Expr.scala | cut -d' ' -f1)"
            printf 'binary_recursive_adt_source_manifest_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-binary-recursive-adt-3.9.0/source-hashes.tsv | cut -d' ' -f1)"
            printf 'binary_recursive_adt_artifact_manifest_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-binary-recursive-adt-3.9.0/scala-artifacts.sha256.tsv | cut -d' ' -f1)"
            printf 'nested_recursive_adt_source_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-nested-recursive-adt-3.9.0/Expr.scala | cut -d' ' -f1)"
            printf 'nested_recursive_adt_source_manifest_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-nested-recursive-adt-3.9.0/source-hashes.tsv | cut -d' ' -f1)"
            printf 'nested_recursive_adt_artifact_manifest_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-nested-recursive-adt-3.9.0/scala-artifacts.sha256.tsv | cut -d' ' -f1)"
            printf 'nested_recursive_adt_oracle_output_manifest_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/source-nested-recursive-adt-3.9.0/output-sha256.tsv | cut -d' ' -f1)"
            printf 'pull_request_url\t%s\n' "${{ github.event.pull_request.html_url || '' }}"
            printf 'inherited_source_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/inherited-members-3.9.0/InheritedMembers.scala | cut -d' ' -f1)"
            printf 'inherited_four_root_receipt_sha256\t%s\n' \
              "$(sha256sum crates/dotty-typer/tests/fixtures/inherited-members-3.9.0/four-root-baseline.tsv | cut -d' ' -f1)"
            printf 'rust\t%s\n' "$(rustc +1.98.1 --version)"
            printf 'cargo\t%s\n' "$(cargo +1.98.1 --version)"
            printf 'java\t%s\n' "$(java --version | head -1)"
            sha256sum "$JAVA_HOME/release" "$JAVA_HOME/bin/java"
            printf 'cargo_build_jobs\t%s\n' "$CARGO_BUILD_JOBS"
            printf 'rust_test_threads\t%s\n' "$RUST_TEST_THREADS"
          } > "$DOTTY_AUDIT_REPORT_DIR/environment.tsv"
          cp crates/dotty-typer/tests/fixtures/lexical-closure-contract/six-root-gate.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/positive-root-contract.tsv"
          cp docs/typer-lexical-closure-rollback-matrix-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/negative-rollback-contract.tsv"
          cp crates/dotty-typer/tests/fixtures/inherited-members-3.9.0/four-root-baseline.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/inherited-positive-contract.tsv"
          cp docs/typer-inherited-members-e2e-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/inherited-e2e-receipt.tsv"
          cp docs/typer-inherited-members-negative-receipt-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/inherited-negative-contract.tsv"
          cp docs/typer-inherited-members-cohort-receipt-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/inherited-cohort-receipt.tsv"
          cp docs/typer-source-case-class-match-positive-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-positive-contract.tsv"
          cp docs/typer-source-case-class-match-negative-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-negative-contract.tsv"
          cp docs/typer-source-case-class-match-cohorts-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-cohort-contract.tsv"
          cp docs/typer-heterogeneous-product2-match-positive-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/product2-positive-contract.tsv"
          cp docs/typer-heterogeneous-product2-match-negative-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/product2-negative-contract.tsv"
          cp docs/typer-heterogeneous-product2-match-cohorts-3.9.0.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/product2-cohort-contract.tsv"

      - name: Download and verify pinned Scala runtime artifacts
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ github.workspace }}/target/coursier/v1/https/repo1.maven.org/maven2
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          while IFS=' ' read -r relative_path sha256; do
            [[ -z "$relative_path" ]] && continue
            destination="$COURSIER_MAVEN_ROOT/$relative_path"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --retry 3 \
              "https://repo1.maven.org/maven2/$relative_path" \
              --output "$destination"
            printf '%s  %s\n' "$sha256" "$destination" | sha256sum --check --status
            printf '%s\t%s\n' "$sha256" "$relative_path" \
              >> "$DOTTY_AUDIT_REPORT_DIR/scala-artifacts.sha256.tsv"
          done <<'ARTIFACTS'
          org/scala-lang/scala3-library_3/3.9.0/scala3-library_3-3.9.0.jar 9343f9651453945fc6a9b75bb4fd230418ee28a1f88ea28ee429f3ebe0511aba
          org/scala-lang/scala-library/3.9.0/scala-library-3.9.0.jar b844bf6fb3080c73df6b9c523b7a69b9ef4a980bb15e5c37c35443d1d0b0e0cd
          org/scala-lang/scala3-compiler_3/3.9.0/scala3-compiler_3-3.9.0.jar 3e2c09a5ca6cef17a55f2f66e123815f9c4ea061fce20d0e9d2371989405a61a
          org/scala-lang/tasty-core_3/3.9.0/tasty-core_3-3.9.0.jar 66e12dda98bb23e864f3a31f8527c8338bf47bce9b85cc380b368c69c1ba8d0f
          org/scala-lang/scala3-interfaces/3.9.0/scala3-interfaces-3.9.0.jar 64dfde1d2c6309d65a01c5f3ea836137eb84338dcadeb16f85764561ef4e10db
          org/scala-lang/modules/scala-asm/9.9.0-scala-1/scala-asm-9.9.0-scala-1.jar 75ac366e8ecb691e06a7e85041eed0f67919a646e5262fa0901225698c104375
          org/scala-sbt/compiler-interface/1.12.0/compiler-interface-1.12.0.jar 92f487a505eafdd0a033e4ff4f38a81509a655c76257c64e6808dd873cc145c3
          org/scala-sbt/util-interface/1.11.5/util-interface-1.11.5.jar 1fc950a9e1a35385e79316e23c120d4fd184f6a7af0274e00a703b0dc76376af
          ARTIFACTS
          cp crates/dotty-typer/tests/fixtures/lexical-closure-contract/scala-artifacts.sha256.tsv \
            "$DOTTY_AUDIT_REPORT_DIR/scala-artifacts.sha256.tsv"

      - name: Type original Option.map and Tuple.toArray in two fresh sessions
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ github.workspace }}/target/coursier/v1/https/repo1.maven.org/maven2
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          mkdir -p "$DOTTY_AUDIT_REPORT_DIR"
          SCALA39_CLASSPATH="$(printf '%s:' \
            "$COURSIER_MAVEN_ROOT/org/scala-lang/scala3-library_3/3.9.0/scala3-library_3-3.9.0.jar" \
            "$COURSIER_MAVEN_ROOT/org/scala-lang/scala-library/3.9.0/scala-library-3.9.0.jar" \
            "$COURSIER_MAVEN_ROOT/org/scala-lang/scala3-compiler_3/3.9.0/scala3-compiler_3-3.9.0.jar" \
            "$COURSIER_MAVEN_ROOT/org/scala-lang/tasty-core_3/3.9.0/tasty-core_3-3.9.0.jar" \
            "$COURSIER_MAVEN_ROOT/org/scala-lang/scala3-interfaces/3.9.0/scala3-interfaces-3.9.0.jar" \
            "$COURSIER_MAVEN_ROOT/org/scala-lang/modules/scala-asm/9.9.0-scala-1/scala-asm-9.9.0-scala-1.jar" \
            "$COURSIER_MAVEN_ROOT/org/scala-sbt/compiler-interface/1.12.0/compiler-interface-1.12.0.jar" \
            "$COURSIER_MAVEN_ROOT/org/scala-sbt/util-interface/1.11.5/util-interface-1.11.5.jar")"
          export SCALA39_CLASSPATH
          export SCALA39_CLASSPATH="${SCALA39_CLASSPATH%:}"
          test "$(git -C "$SCALA39_ROOT" rev-parse HEAD)" = \
            "777528f19a58e794c9954a42f433373472ec57f8"
          test "$(sha256sum "$SCALA39_ROOT/library/src/scala/Option.scala" | cut -d' ' -f1)" = \
            "fadeb6620ab6cdadfd539409e335b38142fa1f6ba6b9143b2d6cfcb90e0076c3"
          for session in 1 2; do
            cargo +1.98.1 test -p dotty-typer --lib --locked \
              preserves_option_map_rollback_and_tuple_to_array_automatic_preparation \
              -- --ignored --nocapture \
              > "$DOTTY_AUDIT_REPORT_DIR/option-map-session-$session.log" 2>&1
            if ! grep -o 'OPTION_MAP_ACCEPTED [^[:cntrl:]]*' \
              "$DOTTY_AUDIT_REPORT_DIR/option-map-session-$session.log" \
              > "$DOTTY_AUDIT_REPORT_DIR/option-map-session-$session.receipt"; then
              echo "Option.map acceptance marker missing from session $session log" >&2
              exit 1
            fi
            test "$(wc -l < "$DOTTY_AUDIT_REPORT_DIR/option-map-session-$session.receipt")" -eq 1
            grep -q 'test result: ok. 1 passed' \
              "$DOTTY_AUDIT_REPORT_DIR/option-map-session-$session.log"
            if ! grep -o 'TUPLE_TO_ARRAY_ACCEPTED_AFTER_AUTOMATIC_PREPARATION [^[:cntrl:]]*' \
              "$DOTTY_AUDIT_REPORT_DIR/option-map-session-$session.log" \
              > "$DOTTY_AUDIT_REPORT_DIR/tuple-to-array-session-$session.receipt"; then
              echo "Tuple.toArray automatic preparation marker missing from session $session log" >&2
              exit 1
            fi
            test "$(wc -l < "$DOTTY_AUDIT_REPORT_DIR/tuple-to-array-session-$session.receipt")" -eq 1
          done
          cmp "$DOTTY_AUDIT_REPORT_DIR/option-map-session-1.receipt" \
            "$DOTTY_AUDIT_REPORT_DIR/option-map-session-2.receipt"
          cmp "$DOTTY_AUDIT_REPORT_DIR/tuple-to-array-session-1.receipt" \
            "$DOTTY_AUDIT_REPORT_DIR/tuple-to-array-session-2.receipt"
          cargo +1.98.1 test -p dotty-typer --lib --locked \
