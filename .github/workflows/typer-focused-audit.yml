          cat "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-namer.log"

      - name: Run exact Typer extractor identity and rollback regressions
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          cargo +1.98.1 test -p dotty-typer --lib --locked \
            issue_1972_failed_root_retries_with_same_typer_and_matches_clean_run -- --nocapture \
            > "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-retry.log" 2>&1
          cargo +1.98.1 test -p dotty-typer --lib --locked unapply -- --nocapture \
            > "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-unapply.log" 2>&1
          cargo +1.98.1 test -p dotty-typer --lib --locked \
            binary_product_extractors_reject_wrong_selector_and_source_arities -- --nocapture \
            > "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-product.log" 2>&1
          cargo +1.98.1 test -p dotty-typer --lib --locked \
            unary_extractor_falls_back_to_get_after_product_arity_mismatch -- --nocapture \
            > "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-unary.log" 2>&1
          cargo +1.98.1 test -p dotty-typer --lib --locked \
            local_patdef_alias_over_extractor_binds_the_original_selector_type -- --nocapture \
            > "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-alias.log" 2>&1
          cat "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-unapply.log"
          cat "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-retry.log"
          cat "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-product.log"
          cat "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-unary.log"
          cat "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-alias.log"

      - name: Run exact #1999 failure-atomic rollback and scope regressions
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          cargo +1.98.1 test -p dotty-typer --lib --locked issue_1999 -- --nocapture \
            > "$DOTTY_AUDIT_REPORT_DIR/issue-1999-rust.log" 2>&1
          cargo +1.98.1 test -p dotty-core --lib --locked \
            remove_drops_the_name_bucket_after_its_last_symbol -- --nocapture \
            > "$DOTTY_AUDIT_REPORT_DIR/issue-1999-scope-rust.log" 2>&1
          cat "$DOTTY_AUDIT_REPORT_DIR/issue-1999-rust.log"
          cat "$DOTTY_AUDIT_REPORT_DIR/issue-1999-scope-rust.log"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py \
            issue1999-rust-log "$DOTTY_AUDIT_REPORT_DIR/issue-1999-rust.log"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py \
            scope-rollback-rust-log "$DOTTY_AUDIT_REPORT_DIR/issue-1999-scope-rust.log"

      - name: Verify exact case-class Match receipts and two-pass cohorts
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          verifier=tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py
          PYTHONDONTWRITEBYTECODE=1 python3 "$verifier" inputs
          PYTHONDONTWRITEBYTECODE=1 python3 "$verifier" oracle-log \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-oracle.log"
          PYTHONDONTWRITEBYTECODE=1 python3 "$verifier" product2-oracle-log \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-product2-oracle.log"
          PYTHONDONTWRITEBYTECODE=1 python3 "$verifier" rust-log \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-rust.log" \
            --tested-sha "$(git rev-parse HEAD)" \
            --expected-sha "$DOTTY_EXPECTED_SOURCE_SHA"
          PYTHONDONTWRITEBYTECODE=1 python3 "$verifier" product2-log \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-rust.log"
          PYTHONDONTWRITEBYTECODE=1 python3 "$verifier" namer-log \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-namer.log"
          PYTHONDONTWRITEBYTECODE=1 python3 "$verifier" typer-log \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-retry.log" \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-unapply.log" \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-product.log" \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-unary.log" \
            "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-typer-alias.log"
      - name: Run exact positive and negative Typer acceptance matrices
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          positive_test='typer::tests::lexical_closure_contract::six_root_gate::six_frozen_roots_type_as_complete_methods_in_two_independent_sessions'
          positive_log="$DOTTY_AUDIT_REPORT_DIR/positive-rust.log"
          cargo +1.98.1 test -p dotty-typer --lib --locked -- \
            "$positive_test" --exact --nocapture > "$positive_log" 2>&1
          cat "$positive_log"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_lexical_closure_acceptance.py \
            test-log --group positive "$positive_log"

          negative_log="$DOTTY_AUDIT_REPORT_DIR/negative-rust.log"
          cargo +1.98.1 test -p dotty-typer --lib --locked lexical_closure_rollback \
            -- --nocapture > "$negative_log" 2>&1
          cat "$negative_log"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_lexical_closure_acceptance.py \
            test-log --group negative "$negative_log"

      - name: Run exact inherited-member Rust acceptance matrix
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          rust_log="$DOTTY_AUDIT_REPORT_DIR/inherited-members-rust.log"
          cargo +1.98.1 test -p dotty-typer --test inherited_members_baseline \
            --locked -- --nocapture > "$rust_log" 2>&1
          cat "$rust_log"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_inherited_members_acceptance.py \
            test-log "$rust_log"

      - name: Run deterministic 25 plus 25 ordinary-method cohorts
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ github.workspace }}/target/coursier/v1/https/repo1.maven.org/maven2
          DOTTY_AUDIT_TMP_ROOT: ${{ github.workspace }}/target/typer-focused-intermediates
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          mkdir -p "$DOTTY_AUDIT_REPORT_DIR"
          DOTTY_AUDIT_TYPE_METHOD_DEFINITION=1 /usr/bin/time -v \
            tools/typer-classpath-corpus-audit/run \
              --method-kind ordinary \
              --method-manifest docs/typer-stdlib-minimal-method-cohort-3.9.0.tsv \
              --require-typed-cohort docs/typer-lexical-closure-acceptance-recovery-3.9.0/required-main.tsv \
              --verify-determinism \
              "$DOTTY_AUDIT_REPORT_DIR/main-cohort.tsv" \
            2> "$DOTTY_AUDIT_REPORT_DIR/main-resource-usage.txt"
          MAIN_AUDIT_RUN_DIR="$(python3 tools/typer-classpath-corpus-audit/audit_run_directory.py resolve "$DOTTY_AUDIT_TMP_ROOT")"
          cp "$MAIN_AUDIT_RUN_DIR/first.ordinary-report.tsv" "$DOTTY_AUDIT_REPORT_DIR/main-cohort-first.tsv"
          cp "$MAIN_AUDIT_RUN_DIR/second.ordinary-report.tsv" "$DOTTY_AUDIT_REPORT_DIR/main-cohort-second.tsv"
          DOTTY_AUDIT_TYPE_METHOD_DEFINITION=1 /usr/bin/time -v \
            tools/typer-classpath-corpus-audit/run \
              --method-kind ordinary \
              --method-manifest docs/typer-stdlib-holdout-acceptance-ii-3.9.0.tsv \
              --require-typed-cohort docs/typer-lexical-closure-acceptance-recovery-3.9.0/required-analysis.tsv \
              --verify-determinism \
              "$DOTTY_AUDIT_REPORT_DIR/analysis-cohort.tsv" \
            2> "$DOTTY_AUDIT_REPORT_DIR/analysis-resource-usage.txt"
          ANALYSIS_AUDIT_RUN_DIR="$(python3 tools/typer-classpath-corpus-audit/audit_run_directory.py resolve "$DOTTY_AUDIT_TMP_ROOT")"
          cp "$ANALYSIS_AUDIT_RUN_DIR/first.ordinary-report.tsv" "$DOTTY_AUDIT_REPORT_DIR/analysis-cohort-first.tsv"
          cp "$ANALYSIS_AUDIT_RUN_DIR/second.ordinary-report.tsv" "$DOTTY_AUDIT_REPORT_DIR/analysis-cohort-second.tsv"
          printf 'Cohorts: 25 frozen main roots + 25 frozen analysis roots; full corpus NOT RUN.\n' \
            > "$DOTTY_AUDIT_REPORT_DIR/status.txt"

      - name: Verify exact case-class Match cohort receipts
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py cohorts \
              --report "$DOTTY_AUDIT_REPORT_DIR/main-cohort-first.tsv" \
              --report "$DOTTY_AUDIT_REPORT_DIR/main-cohort-second.tsv" \
              --report "$DOTTY_AUDIT_REPORT_DIR/analysis-cohort-first.tsv" \
              --report "$DOTTY_AUDIT_REPORT_DIR/analysis-cohort-second.tsv" \
              --baseline-receipt docs/typer-sealed-adt-e2e-cohort-receipt-3.9.0.tsv \
              --output "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-cohorts.tsv"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_source_case_class_match_acceptance.py binary-cohorts \
              --source "$DOTTY_AUDIT_REPORT_DIR/source-case-class-match-cohorts.tsv" \
              --baseline-sha "$DOTTY_EXPECTED_BASE_SHA" \
              --tested-sha "$(git rev-parse HEAD)" \
              --expected-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
              --output "$DOTTY_AUDIT_REPORT_DIR/binary-recursive-adt-protected-cohorts.tsv"
          cp "$DOTTY_AUDIT_REPORT_DIR/binary-recursive-adt-protected-cohorts.tsv" \
            "$DOTTY_AUDIT_REPORT_DIR/nested-recursive-adt-protected-cohorts.tsv"

      - name: Run existing deterministic focused audit baseline
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ github.workspace }}/target/coursier/v1/https/repo1.maven.org/maven2
          DOTTY_AUDIT_TMP_ROOT: ${{ github.workspace }}/target/focused-audit-intermediates
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            tools/typer-classpath-corpus-audit/run \
              --focused-manifest docs/typer-focused-smoke-manifest-3.9.0.tsv \
              --verify-determinism \
              "$DOTTY_AUDIT_REPORT_DIR/focused-report.md" \
            2> "$DOTTY_AUDIT_REPORT_DIR/focused-runtime-resource-usage.txt"
          AUDIT_RUN_DIR="$(python3 tools/typer-classpath-corpus-audit/audit_run_directory.py resolve "$DOTTY_AUDIT_TMP_ROOT")"
          python3 tools/typer-classpath-corpus-audit/verify_focused_gate.py \
            --report "$DOTTY_AUDIT_REPORT_DIR/focused-report.md" \
            --baseline docs/typer-focused-smoke-baseline-3.9.0.txt \
            --timing-output "$DOTTY_AUDIT_REPORT_DIR/focused-timings.tsv" \
            --timing-log "$AUDIT_RUN_DIR/first.log" \
            --timing-rss "$AUDIT_RUN_DIR/first.rss" \
            --timing-log "$AUDIT_RUN_DIR/second.log" \
            --timing-rss "$AUDIT_RUN_DIR/second.rss"
          printf 'Focused-only coverage: 3 files / 31 methods; not a full-corpus result.\n' \
            > "$DOTTY_AUDIT_REPORT_DIR/focused-status.txt"

      - name: Enforce Stdlib Acceptance IV closeout
        if: always()
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
          DOTTY_HOSTED_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOTTY_PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$DOTTY_AUDIT_REPORT_DIR"
          if test "$(sha256sum docs/typer-stdlib-minimal-method-cohort-3.9.0.tsv | cut -d' ' -f1)" \
              != 59bb65f48e7d94423de0f0a00029b98a0b41583e601c700687311e9e17fc5244 \
            || test "$(sha256sum docs/typer-stdlib-holdout-acceptance-ii-3.9.0.tsv | cut -d' ' -f1)" \
              != afa5a2064efd0bfcd31bb0bcb4fb08030db2d180a7619ac3a0843ebbe867f7bc \
            || test "$(sha256sum docs/typer-stdlib-acceptance-iv/measured-2179.tsv | cut -d' ' -f1)" \
              != c616d3d2c93c4522d26375f8809bb362ac30bfffc1c37c6402bdc31e7c7ea752 \
            || test "$(sha256sum docs/typer-sealed-adt-e2e-cohort-receipt-3.9.0.tsv | cut -d' ' -f1)" \
              != c13ba07650429146cfc7148a35e08780af8c3b08989f0b149d3b8d04bd64d9e7; then
            cat > "$DOTTY_AUDIT_REPORT_DIR/acceptance-iv-closeout.md" <<EOF
          # Stdlib Acceptance IV closeout (Scala 3.9.0)

          **Outcome: SPRINT GOAL UNMET.** A frozen cohort manifest or measured receipt changed.

          Hosted run: $DOTTY_HOSTED_RUN
          EOF
            exit 1
          fi
          if ! test -s "$DOTTY_AUDIT_REPORT_DIR/main-cohort-first.tsv" \
            || ! test -s "$DOTTY_AUDIT_REPORT_DIR/analysis-cohort-first.tsv"; then
            cat > "$DOTTY_AUDIT_REPORT_DIR/acceptance-iv-closeout.md" <<EOF
          # Stdlib Acceptance IV closeout (Scala 3.9.0)

          **Outcome: SPRINT GOAL UNMET.** One or both fresh ordinary cohort reports are missing.

          Hosted run: $DOTTY_HOSTED_RUN
          EOF
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 \
            tools/typer-classpath-corpus-audit/verify_ordinary_cohort.py acceptance-iv \
              --main-report "$DOTTY_AUDIT_REPORT_DIR/main-cohort-first.tsv" \
              --analysis-report "$DOTTY_AUDIT_REPORT_DIR/analysis-cohort-first.tsv" \
              --measured-baseline docs/typer-stdlib-acceptance-iv/measured-2179.tsv \
              --integration-receipt docs/typer-sealed-adt-e2e-cohort-receipt-3.9.0.tsv \
              --required-main docs/typer-lexical-closure-acceptance-recovery-3.9.0/required-main.tsv \
              --required-analysis docs/typer-lexical-closure-acceptance-recovery-3.9.0/required-analysis.tsv \
              --output "$DOTTY_AUDIT_REPORT_DIR/stdlib-acceptance-iv.tsv" \
              --report "$DOTTY_AUDIT_REPORT_DIR/acceptance-iv-closeout.md" \
              --tested-revision "$(git rev-parse HEAD)" \
              --pr-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
              --prior-checks-status "$DOTTY_PRIOR_JOB_STATUS" \
              --hosted-run "$DOTTY_HOSTED_RUN"

      - name: Write run-bound sealed Event acceptance report
        if: always()
        shell: bash
        env:
          DOTTY_AUDIT_REPORT_DIR: ${{ github.workspace }}/target/typer-focused-report
          DOTTY_AUDIT_JOB_STATUS: ${{ job.status }}
          DOTTY_PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: python3 tools/write-typer-focused-audit-report.py

      - name: Upload focused report, timings, and intermediates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typer-focused-audit-${{ github.sha }}
          path: |
            ${{ github.workspace }}/target/typer-focused-report/
            ${{ github.workspace }}/target/typer-focused-intermediates/
            ${{ github.workspace }}/target/focused-audit-intermediates/
            ${{ github.workspace }}/target/lexical-closure-contract-oracle/
            ${{ github.workspace }}/target/source-case-class-product2-oracle/
            ${{ github.workspace }}/target/source-sealed-adt-match-oracle/
            ${{ github.workspace }}/target/source-sealed-adt-match-rollback-oracle/
            ${{ github.workspace }}/target/source-recursive-adt-match-oracle/
            ${{ github.workspace }}/target/source-recursive-adt-negative-matrix/
            ${{ github.workspace }}/target/source-binary-recursive-adt-oracle/
          if-no-files-found: error
          retention-days: 30
