name: "Typer #1180 pinned audit"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/typer-1180-audit.yml"
      - "crates/dotty-classloader/**"
      - "crates/dotty-typer/**"
      - "tools/typer-classpath-corpus-audit/**"
      - "docs/typer-classpath-corpus-audit-3.9.0.md"
      - "docs/typer-classpath-import-prefix-profile-1180-3.9.0.md"

permissions:
  contents: read

jobs:
  pinned-audit:
    if: github.head_ref == 'codex/issue-1180-lexical-package-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out dotty-rs
        uses: actions/checkout@v4

      - name: Check out pinned Scala 3.9.0 sources
        uses: actions/checkout@v4
        with:
          repository: scala/scala3
          ref: 777528f19a58e794c9954a42f433373472ec57f8
          path: .worktrees/scala39-source

      - name: Install pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.8"

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo and Scala artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            .cache/coursier
          key: ${{ runner.os }}-typer-1180-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-typer-1180-

      - name: Download pinned Scala 3.9.0 artifacts
        env:
          COURSIER_MAVEN_ROOT: ${{ github.workspace }}/.cache/coursier/v1/https/repo1.maven.org/maven2
        run: |
          set -euo pipefail
          while IFS= read -r artifact; do
            destination="$COURSIER_MAVEN_ROOT/$artifact"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --silent --show-error \
              "https://repo1.maven.org/maven2/$artifact" \
              --output "$destination"
          done <<'ARTIFACTS'
          org/scala-lang/scala3-library_3/3.9.0/scala3-library_3-3.9.0.jar
          org/scala-lang/scala-library/3.9.0/scala-library-3.9.0.jar
          org/scala-lang/scala3-compiler_3/3.9.0/scala3-compiler_3-3.9.0.jar
          org/scala-lang/tasty-core_3/3.9.0/tasty-core_3-3.9.0.jar
          org/scala-lang/scala3-interfaces/3.9.0/scala3-interfaces-3.9.0.jar
          org/scala-lang/modules/scala-asm/9.9.0-scala-1/scala-asm-9.9.0-scala-1.jar
          org/scala-sbt/compiler-interface/1.12.0/compiler-interface-1.12.0.jar
          org/scala-sbt/util-interface/1.11.5/util-interface-1.11.5.jar
          ARTIFACTS

      - name: Run pinned corpus audit twice
        env:
          SCALA39_ROOT: ${{ github.workspace }}/.worktrees/scala39-source
          SCALA39_JDK_RELEASE: "21"
          COURSIER_MAVEN_ROOT: ${{ github.workspace }}/.cache/coursier/v1/https/repo1.maven.org/maven2
          DOTTY_AUDIT_TMP_ROOT: ${{ runner.temp }}/typer-1180-audit-intermediates
        run: |
          tools/typer-classpath-corpus-audit/run --verify-determinism \
            "$RUNNER_TEMP/typer-classpath-corpus-audit-1180-3.9.0.md"
          tools/typer-classpath-corpus-audit/run --import-prefix-profile \
            --verify-determinism \
            "$RUNNER_TEMP/typer-classpath-import-prefix-profile-1180-3.9.0.md"

      - name: Upload deterministic audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typer-1180-pinned-audit
          path: |
            ${{ runner.temp }}/typer-classpath-corpus-audit-1180-3.9.0*
            ${{ runner.temp }}/typer-classpath-import-prefix-profile-1180-3.9.0*
            ${{ runner.temp }}/typer-1180-audit-intermediates/**
          if-no-files-found: warn
