name: CI Cargo compile timings

on:
  workflow_dispatch:
    inputs:
      cache:
        description: Select the full target cache, Rust dependency cache, or a cold build
        required: true
        type: choice
        default: full
        options:
          - full
          - rust-cache
          - cold
      workload:
        description: Compile only or run the complete Rust checks workload
        required: true
        type: choice
        default: compile-only
        options:
          - compile-only
          - full-rust-checks

permissions:
  contents: read

concurrency:
  group: ci-cargo-timings-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  cargo-timings:
    name: CI workload cache timing
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Restore full CI Cargo cache
        id: full-cache
        if: inputs.cache == 'full'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: ${{ runner.os }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}-test-no-debug-no-incremental
          restore-keys: |
            ${{ runner.os }}-cargo-debug-

      - name: Restore Rust dependency cache
        id: rust-cache
        if: inputs.cache == 'rust-cache'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: dotty-rs-ci-rust-checks

      - name: Record measurement environment
        env:
          FULL_CACHE_HIT: ${{ steps.full-cache.outputs.cache-hit }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          mkdir -p target/cargo-timings
          {
            printf 'commit\t%s\n' "$(git rev-parse HEAD)"
            printf 'rust\t%s\n' "$(rustc --version)"
            printf 'cargo\t%s\n' "$(cargo --version)"
            printf 'runner_os\t%s\n' '${{ runner.os }}'
            printf 'cache_mode\t%s\n' '${{ inputs.cache }}'
            printf 'workload\t%s\n' '${{ inputs.workload }}'
            printf 'cache_hit\t%s\n' "${FULL_CACHE_HIT:-${RUST_CACHE_HIT:-not-applicable}}"
          } > target/cargo-timings/environment.tsv

      - name: Compile the workspace test targets and write Cargo timings
        if: inputs.workload == 'compile-only'
        run: cargo test --workspace --all-targets --locked --no-run --timings

      - name: Lint GitHub Actions workflows
        if: inputs.workload == 'full-rust-checks'
        run: tools/check-workflows.sh

      - name: Check formatting
        if: inputs.workload == 'full-rust-checks'
        run: cargo fmt --all -- --check

      - name: Check frontend platform boundaries
        if: inputs.workload == 'full-rust-checks'
        run: python3 tools/check-frontend-boundaries.py

      - name: Run Clippy
        if: inputs.workload == 'full-rust-checks'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        if: inputs.workload == 'full-rust-checks'
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --no-deps --locked

      - name: Run tests
        if: inputs.workload == 'full-rust-checks'
        run: cargo test --workspace --all-targets --locked

      - name: Check diff
        if: inputs.workload == 'full-rust-checks'
        run: git diff --check

      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ github.sha }}-${{ inputs.workload }}-${{ inputs.cache }}
          path: target/cargo-timings/
          if-no-files-found: warn
          retention-days: 30
