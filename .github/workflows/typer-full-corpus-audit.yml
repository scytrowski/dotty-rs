name: Typer full corpus audit

on:
  workflow_dispatch:
    inputs:
      run_full_audit:
        description: Run two sequential pinned full-corpus audits on a hosted runner
        type: choice
        options:
          - do-not-run
          - run-full-audit
        default: do-not-run
        required: true

permissions:
  contents: read

concurrency:
  group: typer-full-corpus-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.run_full_audit == 'run-full-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
      SCALA39_JDK_RELEASE: 21
      SCALA39_ROOT: ${{ github.workspace }}/scala39-source

    steps:
      - name: Check out dotty-rs
        uses: actions/checkout@v4

      - name: Check out pinned Scala 3.9.0 sources
        uses: actions/checkout@v4
        with:
          repository: scala/scala3
          ref: 777528f19a58e794c9954a42f433373472ec57f8
          path: scala39-source
          persist-credentials: false

      - name: Install pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.8+9'
          check-latest: false

      - name: Verify pinned runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$SCALA39_ROOT" rev-parse HEAD)" = "777528f19a58e794c9954a42f433373472ec57f8"
          grep -q '^JAVA_VERSION="21.0.8"$' "$JAVA_HOME/release"
          test -d "$JAVA_HOME/jmods"
          rustup toolchain install 1.98.1 --profile minimal
          printf 'CARGO_BUILD_JOBS=%s\nRUST_TEST_THREADS=%s\n' \
            "$CARGO_BUILD_JOBS" "$RUST_TEST_THREADS"

      - name: Download and verify Scala runtime artifacts
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ runner.temp }}/coursier/v1/https/repo1.maven.org/maven2
        run: |
          set -euo pipefail
          mkdir -p "$COURSIER_MAVEN_ROOT" "$RUNNER_TEMP/typer-audit-report"
          while IFS=' ' read -r relative_path sha256; do
            [[ -z "$relative_path" ]] && continue
            destination="$COURSIER_MAVEN_ROOT/$relative_path"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --retry 3 \
              "https://repo1.maven.org/maven2/$relative_path" \
              --output "$destination"
            printf '%s  %s\n' "$sha256" "$destination" | sha256sum --check --status
            printf '%s\t%s\n' "$sha256" "$relative_path" \
              >> "$RUNNER_TEMP/typer-audit-report/scala-artifacts.sha256.tsv"
          done <<'ARTIFACTS'
          org/scala-lang/scala3-library_3/3.9.0/scala3-library_3-3.9.0.jar 9343f9651453945fc6a9b75bb4fd230418ee28a1f88ea28ee429f3ebe0511aba
          org/scala-lang/scala-library/3.9.0/scala-library-3.9.0.jar b844bf6fb3080c73df6b9c523b7a69b9ef4a980bb15e5c37c35443d1d0b0e0cd
          org/scala-lang/scala3-compiler_3/3.9.0/scala3-compiler_3-3.9.0.jar 3e2c09a5ca6cef17a55f2f66e123815f9c4ea061fce20d0e9d2371989405a61a
          org/scala-lang/tasty-core_3/3.9.0/tasty-core_3-3.9.0.jar 66e12dda98bb23e864f3a31f8527c8338bf47bce9b85cc380b368c69c1ba8d0f
          org/scala-lang/scala3-interfaces/3.9.0/scala3-interfaces-3.9.0.jar 64dfde1d2c6309d65a01c5f3ea836137eb84338dcadeb16f85764561ef4e10db
          org/scala-lang/modules/scala-asm/9.9.0-scala-1/scala-asm-9.9.0-scala-1.jar 75ac366e8ecb691e06a7e85041eed0f67919a646e5262fa0901225698c104375
          org/scala-sbt/compiler-interface/1.12.0/compiler-interface-1.12.0.jar 92f487a505eafdd0a033e4ff4f38a81509a655c76257c64e6808dd873cc145c3
          org/scala-sbt/util-interface/1.11.5/util-interface-1.11.5.jar 1fc950a9e1a35385e79316e23c120d4fd184f6a7af0274e00a703b0dc76376af
          ARTIFACTS
          sha256sum "$JAVA_HOME"/jmods/*.jmod \
            > "$RUNNER_TEMP/typer-audit-report/jdk-jmods.sha256"
          java --version | tee "$RUNNER_TEMP/typer-audit-report/java-version.txt"
          cat "$JAVA_HOME/release" >> "$RUNNER_TEMP/typer-audit-report/java-version.txt"

      - name: Run two sequential normalized audits
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ runner.temp }}/coursier/v1/https/repo1.maven.org/maven2
          DOTTY_AUDIT_TMP_ROOT: ${{ runner.temp }}/typer-audit-intermediates
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            tools/typer-classpath-corpus-audit/run --verify-determinism \
              "$RUNNER_TEMP/typer-audit-report/typer-classpath-corpus-audit-post-tasty-parents-3.9.0.md" \
            2> "$RUNNER_TEMP/typer-audit-report/runtime-resource-usage.txt"

      - name: Reconcile frozen TASTy parent roots
        shell: bash
        env:
          COURSIER_MAVEN_ROOT: ${{ runner.temp }}/coursier/v1/https/repo1.maven.org/maven2
          SCALA39_COMPILER_JAR: ${{ runner.temp }}/coursier/v1/https/repo1.maven.org/maven2/org/scala-lang/scala3-compiler_3/3.9.0/scala3-compiler_3-3.9.0.jar
          SCALA39_LIBRARY_JAR: ${{ runner.temp }}/coursier/v1/https/repo1.maven.org/maven2/org/scala-lang/scala-library/3.9.0/scala-library-3.9.0.jar
          SCALA39_LIBRARY3_JAR: ${{ runner.temp }}/coursier/v1/https/repo1.maven.org/maven2/org/scala-lang/scala3-library_3/3.9.0/scala3-library_3-3.9.0.jar
          SCALA39_PARENT_PROFILE_OUTPUT: ${{ runner.temp }}/typer-audit-report/current-tasty-supertype-profile.tsv
        run: |
          set -euo pipefail
          CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 \
            cargo test -p dotty-classloader --lib --locked \
              profile_frozen_unresolved_supertype_parent_roots -- --ignored --nocapture
          PYTHONDONTWRITEBYTECODE=1 \
            python3 tools/typer-classpath-corpus-audit/reconcile_tasty_supertype_roots.py \
              --baseline docs/typer-classpath-corpus-audit-post-compiler-modules-3.9.0-tasty-supertype-roots.tsv \
              --historical-parent-profile docs/classloader-unresolved-tasty-parent-profile-3.9.0.tsv \
              --parent-profile "$SCALA39_PARENT_PROFILE_OUTPUT" \
              --source-provenance "$RUNNER_TEMP/typer-classpath-corpus-audit-post-tasty-parents-3.9.0-tasty-parent-source-provenance.tsv" \
              --rows "$RUNNER_TEMP/typer-audit-report/typer-classpath-corpus-audit-post-tasty-parents-3.9.0-tasty-supertype-roots.tsv" \
              --summary "$RUNNER_TEMP/typer-audit-report/tasty-supertype-root-summary.txt"
          {
            printf '\n## #1417 current TASTy parent reconciliation\n\n'
            printf 'The table joins every frozen #1342 root to its original failed parent, current parent resolution, full hierarchy load result, source-audit observation count, and current source files. Newly observed roots remain separate rows. The full matrix is [typer-classpath-corpus-audit-post-tasty-parents-3.9.0-tasty-supertype-roots.tsv](typer-classpath-corpus-audit-post-tasty-parents-3.9.0-tasty-supertype-roots.tsv).\n\n'
            printf '```text\n'
            cat "$RUNNER_TEMP/typer-audit-report/tasty-supertype-root-summary.txt"
            printf '```\n\n'
            printf 'The standalone TASTy parent profile is retained at [current-tasty-supertype-profile.tsv](current-tasty-supertype-profile.tsv). The source-level root/file observations are retained at [typer-classpath-corpus-audit-post-tasty-parents-3.9.0-tasty-parent-source-provenance.tsv](typer-classpath-corpus-audit-post-tasty-parents-3.9.0-tasty-parent-source-provenance.tsv).\n'
          } >> "$RUNNER_TEMP/typer-audit-report/typer-classpath-corpus-audit-post-tasty-parents-3.9.0.md"

      - name: Upload reports, sidecars, inputs, and sequential run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typer-full-corpus-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typer-audit-report/
            ${{ runner.temp }}/typer-audit-intermediates/
          if-no-files-found: error
          retention-days: 30
