name: Scala parser oracle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  parser-oracle:
    name: Scala 3.9 parser oracle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Scala build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-scala-parser-oracle-${{ hashFiles('tools/scala-parser-oracle/build.sbt', 'tools/scala-parser-oracle/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-scala-parser-oracle-

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run Scala 3.9 parser differential oracle
        run: bash tools/scala-parser-oracle/compare.sh
