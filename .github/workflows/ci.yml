name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: ${{ runner.os }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}-test-no-debug-no-incremental
          restore-keys: |
            ${{ runner.os }}-cargo-debug-

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check frontend platform boundaries
        run: python3 tools/check-frontend-boundaries.py

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Check diff
        run: git diff --check

  classfile-jvm-encoder:
    name: Classfile JVM encoder gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Record Rust version for cache key
        id: rust-version
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache JVM gate build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: ${{ runner.os }}-cargo-classfile-jvm-${{ hashFiles('**/Cargo.lock') }}-${{ steps.rust-version.outputs.version }}-test-no-debug-no-incremental
          restore-keys: |
            ${{ runner.os }}-cargo-classfile-jvm-${{ steps.rust-version.outputs.version }}-

      - name: Verify generated class files with the JVM
        env:
          DOTTY_CLASSFILE_REQUIRE_JDK: '1'
        run: |
          cargo +stable test \
            -p dotty-classfile --test classfile_jvm_encoder \
            -p dotty-jvm --lib \
            -p dotty --test jvm_source_compilation \
            --test jvm_stateful_class_contract \
            --locked -- --nocapture
