name: Lexer compatibility

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: Corpus to compare with the Scala 3.9.0 oracle
        required: true
        type: choice
        default: fixtures
        options:
          - fixtures
          - source-corpus
          - all

permissions:
  contents: read

concurrency:
  group: lexer-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Scala lexer compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Test comparison normalizer
        run: python3 -m unittest discover -s tools/scala-lexer-oracle -p 'test_compare.py'

      - name: Verify selected corpus
        env:
          CORPUS: ${{ inputs.corpus }}
        run: |
          case "$CORPUS" in
            fixtures)
              bash tools/scala-lexer-oracle/compare.sh
              ;;
            source-corpus)
              bash tools/scala-lexer-oracle/check-corpus.sh
              ;;
            all)
              bash tools/scala-lexer-oracle/compare.sh
              bash tools/scala-lexer-oracle/check-corpus.sh
              ;;
            *)
              echo "unknown corpus: $CORPUS" >&2
              exit 2
              ;;
          esac
