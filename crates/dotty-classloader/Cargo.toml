[package]
name = "dotty-classloader"
version = "0.1.0"
edition = "2024"

[dependencies]
dotty-tasty = { path = "../dotty-tasty" }
dotty-classfile = { path = "../dotty-classfile" }
dotty-core = { path = "../dotty-core" }
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
unicode-ident = "1.0.24"

[dev-dependencies]
dotty-tasty-unpickler = { path = "../dotty-tasty-unpickler" }
